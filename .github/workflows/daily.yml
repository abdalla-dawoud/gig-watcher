name: Daily gig digest

# Runs every day at 07:00 UTC (09:00 Cairo) and commits the fresh digest.
# You can also start it by hand from the Actions tab.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build digest
        run: python gig_watcher.py --out digest.md --html digest.html --since-hours 48

      - name: Commit digest
        run: |
          git config user.name "gig-watcher[bot]"
          git config user.email "gig-watcher[bot]@users.noreply.github.com"
          git add digest.md digest.html seen.sqlite3
          git commit -m "digest: $(date -u +%Y-%m-%d)" || echo "nothing new"
          git push
